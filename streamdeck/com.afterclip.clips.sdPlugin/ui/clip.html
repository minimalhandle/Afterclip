<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="inspector.css">
</head>
<body>
<label>Clip seconds <input id="seconds" type="number" min="0" step="1" value="30"></label>
<p>Use 0 to save the whole buffer.</p>
<hr>
<div id="connection"></div>
<script src="connection.js"></script>
<script>
  // Stream Deck calls this global when the inspector opens.
  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, _info, actionInfo) {
    const ws = new WebSocket(`ws://127.0.0.1:${port}`);
    const input = document.getElementById('seconds');
    const saved = JSON.parse(actionInfo).payload.settings.seconds;
    if (Number.isInteger(saved)) input.value = saved;
    // Registering comes first, so the settings page asks nothing before Stream Deck knows it.
    ws.addEventListener('open', () => ws.send(JSON.stringify({ event: registerEvent, uuid })), { once: true });
    afterclipConnection(ws, uuid);
    input.onchange = () => {
      const seconds = Math.max(0, Math.round(Number(input.value)) || 0);
      input.value = seconds;
      ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: { seconds } }));
    };
  }
</script>
</body>
</html>
